# Campos que `panduck init tufte-book` pregunta al crear el proyecto. Cada clave
# corresponde a un marcador {{clave}} en head.yaml. Este archivo no se copia al
# directorio del usuario.
[[prompts]]
key = "titulo"
question = "Titulo del libro"
default = "Titulo del libro"

[[prompts]]
key = "subtitulo"
question = "Subtitulo"
default = "Un apunte escrito en markdown"

[[prompts]]
key = "autor"
question = "Autor(a)"
default = "Nombre Apellido"

[[prompts]]
key = "fecha"
question = "Fecha"
default = "2026"
