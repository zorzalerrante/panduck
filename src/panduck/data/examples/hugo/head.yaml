---
title: "{{titulo}}"
date: {{fecha}}

# Las etiquetas del post. Si el documento ya trae `keywords:` (porque tambien se
# compila como paper), sirven igual y no hace falta repetirlas aca.
tags:
  - visualizacion
  - datos

# Indice al costado del post (lo muestra el tema).
toc: true

# Cualquier otra clave del front matter va bajo `hugo:` y se copia tal cual, sin
# tocar panduck: draft, series, thumbnail, las que use tu tema.
hugo:
  draft: true

# Citas. La bibliografia sale como lista al final, bajo el encabezado que
# escribas en el cuerpo.
bibliography: references.bib
csl: apa-6th-edition.csl

# Colores y fuente de los diagramas Graphviz.
dot-fg: "#1a1a1a"
dot-accent: "#cf3889"
dot-font: "Liberation Sans"

# En markdown el diagrama sale como PNG a 200 dpi sobre un fondo claro, para que
# se lea igual en un sitio con modo oscuro. Para cambiarlo:
# dot-canvas: "#f4f4f5"   # fondo del lienzo (default "#faf8f5")
# dot-dpi: 300            # resolucion del PNG (default 200)
# dot-format: mermaid     # lo dibuja el navegador y hereda el tema del sitio
---
