---
# Tamano de pagina. Instagram vertical 4:5 = 1080x1350 px (10cm x 12.5cm).
# Para carrusel cuadrado 1:1 usar width: 11cm y height: 11cm.
width: 10cm
height: 12.5cm
margin: 0.9cm
fontsize: 14pt
# Tipografia: cualquier fuente instalada en el sistema, por su nombre de familia
# tipografica (el que reporta `typst fonts`, que puede diferir del de fontconfig,
# p. ej. "Recursive Sn Lnr St"). mainfont es el cuerpo; sansfont son los spans
# .sff/.sans. typst no escanea ~/.fonts: panduck le pasa esa ruta automaticamente.
mainfont: "Liberation Sans"
# sansfont: "Liberation Sans"
# Fondo y color por defecto de todos los posts (cada post puede sobreescribir
# con atributos en su encabezado). Si no se fija textcolor, panduck elige
# claro u oscuro por contraste con el fondo.
pagecolor: "f4efe6"
# textcolor: "2d2d2d"
# background-image: bg.png
# Velo negro sobre la imagen de fondo, 0 a 1, para que el texto despegue de una
# foto con detalle. Entra en el calculo de contraste del color de texto.
# background-dim: 0.35
# Pie comun a todos los posts. Acepta iconos FontAwesome como shortcodes
# (:instagram: :globe: :envelope: :twitter: :youtube: ...). El numero de post
# (n / total) se agrega al borde contrario de la marca; se apaga con
# `no-slide-number: true`, o post a post con la clase .nonumber.
footer: "{{footer}}"
# Cabecera comun (mismo formato que el pie). Cada post puede poner la suya con
# `# {header="..."}` o sacarla con .noheader; lo mismo para el pie.
# header: "Serie de lectura"
# Imagen suelta sobre el post, dibujada fuera del margen y sin mover el
# contenido (un sello, un logo, una mascota). Aqui seria comun a todos los posts;
# cada uno la cambia con `# {overlay="otra.png"}` o la saca con .nooverlay.
# overlay-position combina left/center/right con top/middle/bottom en cualquier
# orden (bottom-right es el defecto, y lo que no se nombra queda centrado:
# "bottom" es lo mismo que "bottom-center"); overlay-inset la despega del borde y
# overlay-x / overlay-y la corren desde esa esquina.
# overlay: sello.png
# overlay-width: 22%
# overlay-position: top-right
# overlay-inset: 0.3cm
# Donde va la marca en cada franja: left, center (defecto) o right.
# header-align: "center"
# footer-align: "center"
# Interlineado del cuerpo; se aprieta para posts con mucho texto (tambien post a
# post con `# {leading="0.55em"}`).
# leading: 0.7em
---
