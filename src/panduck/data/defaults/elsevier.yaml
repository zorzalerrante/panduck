from: markdown+smart+citations
standalone: true
pdf-engine: xelatex
template: elsevier
filters:
  # los filtros lua se resuelven desde <data-dir>/filters
  # diagramas de graphviz escritos en el documento (```{.dot}); el formato de la
  # imagen sale del writer (svg en typst, pdf en latex). Va primero: la figura
  # que produce tiene que existir antes de crossref y de fonts-and-alignment
  - graphviz.lua
  - strip-header-includes.lua
  - process-affiliations.lua
  - pandoc-crossref
  - citeproc
  # despues de strip-header-includes para que su inyeccion (ulem/varwidth, solo si
  # se usan esas clases) sobreviva; tipografia/alineacion/color por clases pfa-*
  - fonts-and-alignment.lua
  # corre despues de citeproc: inserta las declaraciones de back-matter (Funding,
  # Competing interests, Data availability) antes de las referencias
  - insert-declarations-before-refs.lua
