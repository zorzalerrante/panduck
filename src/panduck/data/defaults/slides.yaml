# Slides academicas en PDF via typst (rapido, sin LaTeX). El nivel de slide
# es ## (level 2); # genera una slide de seccion. panduck genera el .typ con
# pandoc y luego corre `typst compile` para producir el PDF (ver cli.py).
from: markdown+smart+citations
to: typst
wrap: none  # no envolver la salida: un font-name largo partido en 2 lineas rompe el string typst
standalone: true
template: slides
metadata:
  # paleta de los diagramas .dot: el tema de las slides vive hardcodeado en
  # slides.typst (el escape de `#` rompe la interpolacion de variables), asi que
  # el filtro lo selecciona por nombre. Aca va el nombre y no los colores porque
  # el `metadata:` de un defaults gana sobre el head y el documento no podria
  # cambiarlos; los colores sueltos (dot-fg, dot-bg, dot-accent) si se ponen en
  # el head y tienen prioridad sobre el tema.
  dot-theme: slides
filters:
  # diagramas de graphviz escritos en el documento (```{.dot}); el formato de la
  # imagen sale del writer (svg en typst, pdf en latex). Va primero: la figura
  # que produce tiene que existir antes de crossref y de fonts-and-alignment
  - graphviz.lua
  - citeproc
  # post-citeproc: aplana los Cite para que el writer de typst no emita #cite
  - typst-flatten-cites.lua
  # estilos inline (tamano/versalitas/peso/familia/color) por clases pfa-*; corre
  # ANTES de la particion para ver los Span/Div antes de envolverlos en #slide[]
  - fonts-and-alignment.lua
  # rescata el LaTeX crudo que el writer typst descarta sin avisar (\clearpage,
  # \begin{align*}, \mbox...) y avisa por stderr de lo que no pudo traducir. Va
  # antes de typst-fix-symbols, que trabaja sobre los Math que este recupera
  - typst-raw-latex.lua
  # arregla simbolos math que el writer typst emite con nombres viejos (\langle,
  # \cap, \lceil...); antes de la particion, que serializa el contenido a typst
  - typst-fix-symbols.lua
  # parte el cuerpo en slides y traduce columnas, fondos y diagramas Graphviz
  - typst-slides.lua
